name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP and PHTML
        run: find module-* \( -name '*.php' -o -name '*.phtml' \) -print0 | xargs -0 -n1 php -l
      - name: Validate composer.json files
        run: for f in composer.json module-*/composer.json; do composer validate --no-check-publish --no-check-lock "$f"; done

  coding-standard:
    name: Magento coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      # errors fail the build; warnings (docblocks) are reported only, until the documentation pass
      - run: vendor/bin/phpcs -n
